name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 安裝 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安裝 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 編譯 Flutter APK
        run: |
          cd apps/ai-guide-companion/mobile
          flutter pub get
          flutter build apk --release

      - name: 上傳打包好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: apps/ai-guide-companion/mobile/build/app/outputs/flutter-apk/*.apk
